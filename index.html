<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бензин рядом</title>
    
    <!-- Подключаем стили Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #1a1a1a;
        }
        #map {
            width: 100%;
            height: 100vh;
        }
        /* Стили для всплывающего окна */
        .leaflet-popup-content-wrapper {
            background: #2a2a2a;
            color: #fff;
            border-radius: 8px;
        }
        .leaflet-popup-tip {
            background: #2a2a2a;
        }
        .fuel-available {
            color: #4ade80;
        }
        .fuel-unavailable {
            color: #f87171;
        }
        .load-low { color: #4ade80; }
        .load-medium { color: #fbbf24; }
        .load-high { color: #f87171; }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <!-- Подключаем скрипт Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // Создаём карту, центр — Москва
        var map = L.map('map').setView([55.7558, 37.6173], 12);
        
        // Добавляем тёмный слой карты CartoDB Dark Matter
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap © CARTO',
            maxZoom: 19
        }).addTo(map);
        
        // Функция для определения цвета метки
        function getMarkerColor(load) {
            if (load === 'low') return '#4ade80';      // зелёный
            if (load === 'medium') return '#fbbf24';   // жёлтый
            if (load === 'high') return '#f87171';     // красный
            return '#9ca3af';                          // серый
        }
        
        // Функция для создания HTML всплывающего окна
        function createPopupContent(station) {
            let fuelsHtml = '';
            station.fuels.forEach(fuel => {
                const statusClass = fuel.available ? 'fuel-available' : 'fuel-unavailable';
                const statusText = fuel.available ? '✅ есть' : '❌ нет';
                fuelsHtml += `<div>${fuel.type}: ${fuel.price} ₽ <span class="${statusClass}">${statusText}</span></div>`;
            });
            
            const loadText = {
                'low': '🟢 Свободно',
                'medium': '🟡 Умеренно',
                'high': '🔴 Очередь'
            };
            
            return `
                <strong>${station.name}</strong><br>
                ${station.brand} · ${station.address}<br>
                <hr style="border-color: #444; margin: 8px 0;">
                ${fuelsHtml}
                <hr style="border-color: #444; margin: 8px 0;">
                <div class="load-${station.load}">${loadText[station.load]}</div>
                <small style="color: #888;">Обновлено: ${new Date(station.updated_at).toLocaleString('ru-RU')}</small>
            `;
        }
        
        // Загружаем данные из stations.json
        fetch('data/stations.json')
            .then(response => response.json())
            .then(stations => {
                stations.forEach(station => {
                    const color = getMarkerColor(station.load);
                    
                    // Создаём круглую метку
                    const marker = L.circleMarker([station.lat, station.lng], {
                        radius: 10,
                        fillColor: color,
                        color: '#fff',
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 0.8
                    }).addTo(map);
                    
                    // Добавляем всплывающее окно
                    marker.bindPopup(createPopupContent(station));
                });
            })
            .catch(error => {
                console.error('Ошибка загрузки данных:', error);
            });
    </script>
</body>
</html>
